name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      # GPUI / winresource need rc.exe and fxc.exe from the Windows SDK.
      # The runner's PATH does not always contain the SDK bin directory.
      - name: Prepare Windows SDK tools
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdkBin = Get-ChildItem $sdkRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64" } |
            Where-Object { Test-Path (Join-Path $_ "fxc.exe") } |
            Select-Object -First 1
          if (-not $sdkBin) { throw "fxc.exe not found in the Windows SDK" }
          $sdkBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "GPUI_FXC_PATH=$(Join-Path $sdkBin 'fxc.exe')" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: cargo build --release --locked -p pw-gui --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/porty.exe package/
          Copy-Item LICENSE, README.md, packaging/README-zh.txt package/
          Compress-Archive -Path package/* -DestinationPath Porty-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Porty-Windows-x64
          path: Porty-Windows-x64.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    # The explicit target keeps the artifact arm64 even if the runner image is
    # Intel; macOS runners have both Apple clang backends.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Build
        run: cargo build --release --locked -p pw-gui --target aarch64-apple-darwin

      - name: Bundle
        run: |
          set -euo pipefail
          file target/aarch64-apple-darwin/release/porty

          APP=dist/Porty.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/aarch64-apple-darwin/release/porty "$APP/Contents/MacOS/porty"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          chmod +x "$APP/Contents/MacOS/porty"

          # Ad-hoc signature; enough for local use. Public distribution still
          # needs an Apple Developer ID + notarization for Gatekeeper.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          mkdir -p package
          cp -R "$APP" package/
          cp README.md LICENSE packaging/README-zh.txt package/
          cd package
          zip -9 -r ../Porty-macOS-arm64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Porty-macOS-arm64
          path: Porty-macOS-arm64.zip
          if-no-files-found: error
