[workspace]
members = ["crates/pw-core", "crates/pw-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Porty contributors"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
russh = { version = "0.65", default-features = false, features = [
    "ring",
    "rsa",
    "flate2",
] }
ssh2-config = "0.9"
dashmap = "6"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gpui = "0.2.2"
gpui-component = "0.5.1"
open = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `zed-async-tar` (pulled in by `gpui`'s HTTP client) depends on `xattr 0.2`,
# which no longer compiles against recent `libc` on Linux. The vendored copy is
# byte-for-byte upstream 0.2.3 apart from mapping `ENOATTR` to `ENODATA` on
# Linux; macOS and Windows builds are unaffected.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
